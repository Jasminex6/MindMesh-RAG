[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical_rag"
version = "0.1.0"
dependencies = [
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "langchain-core>=0.3",
    "langchain-chroma>=0.2",
    "langchain-ollama>=0.3",
    "chromadb>=0.6",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "RAG/evaluation", ".venv/Lib/site-packages"]
typeCheckingMode = "basic"

[tool.vercel]
entrypoint = "api.py"
